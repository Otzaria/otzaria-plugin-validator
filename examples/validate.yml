# Example workflow for an Otzaria plugin repository.
# Copy to .github/workflows/validate.yml in your plugin repo.
name: Validate plugin

on:
  push:
  pull_request:

# Needed only if pr-comment (below) is enabled.
permissions:
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Otzaria plugin
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          # Path to your plugin. Defaults to the repo root.
          path: .
          # Set to true to also fail on warnings (matches the store upload).
          fail-on-warnings: false
          # Post (and replace on every push) a single PR comment with the
          # results table, in addition to the job summary. Only takes effect
          # on pull_request events; a no-op on plain push runs.
          pr-comment: true
          github-token: ${{ github.token }}
