name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm test

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # --require-live: ל-CI יש רשת, ולכן דילוג כאן משמעו תקלה — לא ירוק שקט.
      # ‏אדום צפוי עד ש-docs/plugin-sdk/spec.json יגיע ל-Otzaria/otzaria@dev:
      # זהו כשל אמיתי של תלות סדר, ועדיף עליו מבדיקה מוחלשת שעוברת.
      - run: npm run test:spec-drift -- --require-live

  self-test-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate a known-good plugin
        uses: ./
        with:
          path: test/fixtures/valid-plugin

  self-test-invalid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A known-bad plugin must fail
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: test/fixtures/invalid-plugin
      - name: Assert it failed
        if: steps.bad.outcome == 'success'
        run: |
          echo "Expected the invalid plugin to fail validation, but it passed."
          exit 1
