name: Release

# פרסום אוטומטי: כל דחיפה ל-main שמשנה את הגרסה ב-package.json (או הפעלה
# ידנית) יוצרת תגית vX.Y.Z + Release, ומזיזה את תגית ה-major (v1) אליה.
# אם התגית של הגרסה הנוכחית כבר קיימת — הריצה מדלגת בשקט.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.tag.outputs.exists == 'false'
        run: npm test

      # האתר צורך את ראש תגית v1 בכל בנייה, ולכן הזזת התגית משנה מיד
      # מה שהחנות מריצה. בלי השער הזה גרסה ששוברת את הבנייה של האתר
      # מתגלה רק בפריסה הבאה שלו, אחרי ש-v1 כבר זזה. מאגר ציבורי —
      # ה-checkout וההתקנה לא דורשים סוד.
      - name: Checkout the website
        if: steps.tag.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: Otzaria/Otzaria_Website
          path: website

      - name: Setup Node.js for the website build
        if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        if: steps.tag.outputs.exists == 'false'
        working-directory: website
        run: npm ci --legacy-peer-deps

      # מ-SHA של הריצה ולא מ-#v1: התגית טרם הוזזה בשלב הזה, והנקודה היא
      # לבדוק את הקוד שעומד להפוך ל-v1, לא את זה שכבר שם.
      - name: Install this commit as the website's validator
        if: steps.tag.outputs.exists == 'false'
        working-directory: website
        run: npm install "github:Otzaria/otzaria-plugin-validator#${{ github.sha }}" --legacy-peer-deps --no-save

      - name: Build the website
        if: steps.tag.outputs.exists == 'false'
        working-directory: website
        run: npm run build

      - name: Create release and move major tag
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.v.outputs.version }}"
          MAJOR="v$(echo '${{ steps.v.outputs.version }}' | cut -d. -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
          gh release create "$VERSION" --title "$VERSION" --generate-notes
